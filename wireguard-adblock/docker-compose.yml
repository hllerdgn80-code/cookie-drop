# WireGuard VPN + AdGuard Home reklam engelleyici
# VPN istemcileri DNS olarak AdGuard Home'u (10.8.1.2) kullanır;
# böylece VPN'e bağlı her cihazda reklam ve izleyiciler engellenir.

services:
  adguard:
    image: adguard/adguardhome:v0.107.57
    container_name: adguard
    restart: unless-stopped
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    # Dışarıya port açılmıyor: DNS ve yönetim paneline yalnızca VPN içinden erişilir.
    networks:
      vpn_net:
        ipv4_address: 10.8.1.2

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    depends_on:
      - adguard
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD_HASH=${PASSWORD_HASH}
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=10.8.1.2
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - WG_PERSISTENT_KEEPALIVE=25
    volumes:
      - ./wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "${WG_UI_BIND:-0.0.0.0}:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      vpn_net:
        ipv4_address: 10.8.1.3

networks:
  vpn_net:
    ipam:
      config:
        - subnet: 10.8.1.0/24
